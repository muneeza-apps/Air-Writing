<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Writing Pro | Muneeza Qureshi</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <!-- MediaPipe dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-pink: #ff00ff;
            --neon-lime: #00ff00;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
        }

        #video_feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.25; /* Kept subtle so the #000000 background dominates */
            z-index: 1;
        }

        .canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        #ui_canvas {
            z-index: 3;
            pointer-events: none; /* Let clicks pass through if needed */
        }

        /* Glassmorphism control dock */
        #controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 15px 40px;
            display: flex;
            gap: 40px;
            align-items: center;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .color-picker {
            display: flex;
            gap: 15px;
        }

        .color-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 10px currentColor;
        }

        .color-btn:hover, .color-btn.active {
            transform: scale(1.2);
            border-color: #fff;
            box-shadow: 0 0 20px currentColor;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .slider-container label {
            font-weight: 300;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 120px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        #status-container {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        #status-text {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transition: color 0.3s;
        }

        #status-sub {
            font-size: 14px;
            font-weight: 300;
            color: #aaaaaa;
        }

        #watermark {
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-size: 14px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.4);
            z-index: 10;
            pointer-events: none;
            letter-spacing: 1px;
        }
        
        #watermark strong {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: 300;
            color: #fff;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--neon-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loader" class="loader">
        <div class="spinner"></div>
        <div>Initializing AI Hand Tracking...</div>
    </div>

    <!-- Mirrored background camera -->
    <video id="video_feed" autoplay playsinline></video>
    
    <!-- Drawing canvas (persists strokes) -->
    <canvas id="drawing_canvas" class="canvas-layer"></canvas>
    
    <!-- UI canvas (refreshes every frame for the cursor) -->
    <canvas id="ui_canvas" class="canvas-layer"></canvas>

    <div id="status-container">
        <div id="status-text">Mode: Loading</div>
        <div id="status-sub">Pinch to Write | Fist to Pause | Palm to Clear</div>
    </div>

    <div id="controls">
        <div class="color-picker">
            <button class="color-btn active" style="background: var(--neon-cyan); color: var(--neon-cyan);" onclick="setColor('#00ffff', this)"></button>
            <button class="color-btn" style="background: var(--neon-pink); color: var(--neon-pink);" onclick="setColor('#ff00ff', this)"></button>
            <button class="color-btn" style="background: var(--neon-lime); color: var(--neon-lime);" onclick="setColor('#00ff00', this)"></button>
        </div>
        <div class="slider-container">
            <label>Thickness</label>
            <input type="range" id="thickness" min="2" max="25" value="6" oninput="setThickness(this.value)">
        </div>
    </div>

    <div id="watermark">Developed by <strong>Muneeza Qureshi</strong></div>

    <script>
        const videoElement = document.getElementById('video_feed');
        const drawingCanvas = document.getElementById('drawing_canvas');
        const drawingCtx = drawingCanvas.getContext('2d', { alpha: true });
        const uiCanvas = document.getElementById('ui_canvas');
        const uiCtx = uiCanvas.getContext('2d', { alpha: true });
        const statusText = document.getElementById('status-text');
        const loader = document.getElementById('loader');

        let currentColor = '#00ffff';
        let currentThickness = 6;
        let isWriting = false;
        let lastX = null;
        let lastY = null;

        // Ensure canvas sizes match window perfectly
        function resizeCanvas() {
            drawingCanvas.width = window.innerWidth;
            drawingCanvas.height = window.innerHeight;
            uiCanvas.width = window.innerWidth;
            uiCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function setColor(color, btn) {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            
            // Update loader spinner color to match selection
            document.querySelector('.spinner').style.borderTopColor = color;
        }

        function setThickness(val) {
            currentThickness = parseInt(val);
        }

        // Calculate 3D distance between two MediaPipe landmarks
        function dist3D(p1, p2) {
            return Math.sqrt((p1.x - p2.x)**2 + (p1.y - p2.y)**2 + (p1.z - p2.z)**2);
        }

        // Open Palm detection: Check if all 4 fingertips are further from wrist than their base knuckles (MCP)
        function isPalmExtended(landmarks) {
            const wrist = landmarks[0];
            const tips = [8, 12, 16, 20]; // Index, Middle, Ring, Pinky tips
            const mcps = [5, 9, 13, 17];  // Corresponding MCP joints
            let extendedCount = 0;
            
            for(let i=0; i<4; i++) {
                if(dist3D(wrist, landmarks[tips[i]]) > dist3D(wrist, landmarks[mcps[i]])) {
                    extendedCount++;
                }
            }
            return extendedCount === 4;
        }

        // Closed Fist detection: Check if all 4 fingertips are closer to wrist than their base knuckles (MCP)
        function isClosedFist(landmarks) {
            const wrist = landmarks[0];
            const tips = [8, 12, 16, 20];
            const mcps = [5, 9, 13, 17];
            let curledCount = 0;
            
            for(let i=0; i<4; i++) {
                if(dist3D(wrist, landmarks[tips[i]]) < dist3D(wrist, landmarks[mcps[i]])) {
                    curledCount++;
                }
            }
            return curledCount === 4; // All fingers curled
        }

        function onResults(results) {
            // Hide loader when first results arrive
            if (loader.style.display !== 'none') {
                loader.style.display = 'none';
                statusText.innerText = "Mode: Ready";
            }

            // Clear the cursor UI canvas every frame
            uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Get index finger tip and thumb tip
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                
                // Map to screen coordinates (mirror the X axis for intuitive movement)
                const drawX = window.innerWidth * (1 - indexTip.x);
                const drawY = window.innerHeight * indexTip.y;
                
                // Calculate pinch distance in 3D space
                const pinchDistance = dist3D(indexTip, thumbTip);

                // Determine State Mode based on Gesture Commands
                let currentMode = "Hovering";
                
                if (isPalmExtended(landmarks)) {
                    currentMode = "Clear Canvas";
                    drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
                    isWriting = false;
                } else if (isClosedFist(landmarks)) {
                    currentMode = "Paused";
                    isWriting = false;
                } else if (pinchDistance < 0.05) {
                    currentMode = "Writing";
                    isWriting = true;
                } else {
                    currentMode = "Hovering";
                    isWriting = false;
                }

                // Update Status UI Text & Glow
                statusText.innerText = "Mode: " + currentMode;
                if(currentMode === "Writing") {
                    statusText.style.color = currentColor;
                    statusText.style.textShadow = `0 0 15px ${currentColor}`;
                } else if(currentMode === "Clear Canvas") {
                    statusText.style.color = "#ff4444";
                    statusText.style.textShadow = `0 0 15px #ff4444`;
                } else {
                    statusText.style.color = "#ffffff";
                    statusText.style.textShadow = `0 0 20px rgba(255, 255, 255, 0.4)`;
                }

                // Draw Cursor Dot (Feedback for user's finger position)
                uiCtx.beginPath();
                uiCtx.arc(drawX, drawY, isWriting ? currentThickness : 8, 0, 2 * Math.PI);
                uiCtx.fillStyle = isWriting ? '#ffffff' : currentColor;
                if (!isWriting) {
                    uiCtx.shadowBlur = 20;
                    uiCtx.shadowColor = currentColor;
                } else {
                    uiCtx.shadowBlur = 0;
                }
                uiCtx.fill();

                // Draw the actual lines on the persistent canvas
                if (isWriting) {
                    if (lastX !== null && lastY !== null) {
                        // 1. Draw the Neon Glow (Outer stroke)
                        drawingCtx.beginPath();
                        drawingCtx.moveTo(lastX, lastY);
                        drawingCtx.lineTo(drawX, drawY);
                        drawingCtx.strokeStyle = currentColor;
                        drawingCtx.lineWidth = currentThickness;
                        drawingCtx.lineCap = 'round';
                        drawingCtx.lineJoin = 'round';
                        drawingCtx.shadowBlur = 25;
                        drawingCtx.shadowColor = currentColor;
                        drawingCtx.stroke();
                        
                        // 2. Draw the bright core line (Inner stroke)
                        drawingCtx.beginPath();
                        drawingCtx.moveTo(lastX, lastY);
                        drawingCtx.lineTo(drawX, drawY);
                        drawingCtx.strokeStyle = '#ffffff';
                        drawingCtx.lineWidth = currentThickness * 0.4;
                        drawingCtx.lineCap = 'round';
                        drawingCtx.lineJoin = 'round';
                        drawingCtx.shadowBlur = 0;
                        drawingCtx.stroke();
                    }
                    lastX = drawX;
                    lastY = drawY;
                } else {
                    lastX = null;
                    lastY = null;
                }
            } else {
                // No hand detected
                statusText.innerText = "Mode: Waiting for Hand";
                statusText.style.color = "#aaaaaa";
                statusText.style.textShadow = 'none';
                lastX = null;
                lastY = null;
            }
        }

        // Initialize MediaPipe Hands
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        // Initialize Camera
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });

        camera.start().catch(err => {
            console.error("Camera error:", err);
            loader.innerHTML = `<div>Camera Access Denied or Unavailable.</div><div style="font-size:16px; color:#aaa">Please allow camera permissions and reload.</div>`;
        });
    </script>
</body>
</html>
