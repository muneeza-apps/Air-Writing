<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Air Writing Pro in Flutter">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="air_writing">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Air Writing Pro | Muneeza Qureshi</title>
  <link rel="manifest" href="manifest.json">

  <!-- MediaPipe dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
    }
    #video_feed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.25;
      z-index: 1;
    }
    /* Flutter uses a web engine that creates a glass pane, we need to ensure video is behind it */
    flutter-view {
      z-index: 2;
    }
  </style>
</head>
<body>
  <video id="video_feed" autoplay playsinline></video>

  <script>
    // Expose a global JS callback that Dart will override
    window.onMediaPipeHands = function(results) {};

    const videoElement = document.getElementById('video_feed');

    const hands = new Hands({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    hands.onResults((results) => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            // Serialize landmarks to a JSON string so Dart JS interop can easily parse it
            window.onMediaPipeHands(JSON.stringify(results.multiHandLandmarks[0]));
        } else {
            window.onMediaPipeHands("[]");
        }
    });

    const camera = new Camera(videoElement, {
        onFrame: async () => {
            await hands.send({image: videoElement});
        },
        width: 1280,
        height: 720
    });

    camera.start().catch(err => {
        console.error("Camera error:", err);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
